name: Weekly Upstream PR

on:
  schedule:
    # Runs every Monday at 06:00 UTC (adjust day/hour as needed)
    - cron: "0 6 * * 1"
  workflow_dispatch: # Allows manual testing from the Actions tab

permissions:
  contents: write
  pull-requests: write

jobs:
  create-upstream-pr:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Fetch upstream master
        env:
          UPSTREAM_REPO: sentriz/gonic
        run: |
          git remote add upstream "https://github.com/${UPSTREAM_REPO}.git"
          git fetch upstream master

      - name: Check for new upstream commits
        id: check_diff
        run: |
          # Count commits on upstream/master not yet in local master
          NEW_COMMITS=$(git rev-list --count HEAD..upstream/master || true)
          echo "new_commits=${NEW_COMMITS:-0}" >> "$GITHUB_OUTPUT"

      - name: Push sync branch and open PR
        if: steps.check_diff.outputs.new_commits != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SYNC_BRANCH: sync/upstream-master
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Reset/force-update the sync branch to upstream/master on the fork
          git checkout -B "$SYNC_BRANCH" upstream/master
          git push -f origin "$SYNC_BRANCH"

          # Check if an open PR from this branch already exists
          EXISTING_PR=$(gh pr list --head "$SYNC_BRANCH" --base master --state open --json number --jq '.[0].number // empty')

          if [ -z "$EXISTING_PR" ]; then
            gh pr create \
              --base master \
              --head "$SYNC_BRANCH" \
              --title "chore: sync upstream master (${{ steps.check_diff.outputs.new_commits }} new commits)" \
              --body "Automated weekly check found **${{ steps.check_diff.outputs.new_commits }}** new commit(s) on \`upstream/master`."
          else
            echo "PR #${EXISTING_PR} already exists for ${SYNC_BRANCH} and was updated via force-push."
          fi